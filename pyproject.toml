[project]
name = "claudechat"
version = "0.1.0"
description = "Local CPU-only voice interface to Claude"
license = "GPL-3.0-or-later"
requires-python = "==3.13.*"
dependencies = [
    "faster-whisper==1.2.1",
    "kokoro-onnx==0.6.1",
    "onnxruntime==1.29.0",
    "numpy==2.5.2",
    "soundfile==0.14.0",
]

[project.scripts]
claudechat = "claudechat.cli.daemon:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
# The uv cache and this project often sit on different filesystems, where
# hardlinking fails and uv warns on every run. Copying is the quiet default.
link-mode = "copy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claudechat"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: needs model files on disk", "live: spends Claude quota"]
