<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 448" width="1200" height="448" role="img" aria-labelledby="features-title features-desc">
  <title id="features-title">What claudechat does</title>
  <desc id="features-desc">Six capabilities: it runs entirely on the CPU with no GPU; it needs no API key because it uses your existing Claude login; speech is transcribed and synthesised locally so your voice never leaves the machine; it starts speaking the first sentence while Claude is still writing; a single command turns speech on and off and manages the engine; and it ships 54 voices across nine languages.</desc>
  <defs>
    <style>
      /* ---- LIGHT (default) ---- */
      :root {
        --bg:      #f5f5f5;
        --surface: #ffffff;
        --border:  rgba(45,49,66,0.12);
        --ink:     #2d3142;
        --muted:   #4f5d75;
        --soft:    #7a8399;
        --accent:  #00d7b6;
        --tint:    rgba(0,215,182,0.10);
      }
      /* ---- DARK ---- */
      @media (prefers-color-scheme: dark) {
        :root {
          --bg:      #07090b;
          --surface: #101419;
          --border:  rgba(245,247,248,0.14);
          --ink:     #f5f7f8;
          --muted:   #a9b0b7;
          --soft:    #c8ccce;
          --accent:  #00d7b6;
          --tint:    rgba(0,215,182,0.14);
        }
      }
      .bg      { fill: var(--bg); }
      .card    { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
      .badge   { fill: var(--tint); stroke: var(--accent); stroke-width: 1; }
      .ink     { fill: var(--ink); }
      .muted   { fill: var(--muted); }
      .acc     { fill: var(--accent); }
      .accs    { stroke: var(--accent); stroke-width: 2; fill: none; stroke-linecap: round; }
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .h  { font-size: 17px; font-weight: 700; }
      .b  { font-size: 13.5px; }
      .n  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; letter-spacing: 0.10em; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="448"/>

  <!-- ROW 1 -->
  <!-- 1. CPU -->
  <rect class="card" x="40" y="40" width="352" height="176" rx="8"/>
  <rect class="badge" x="64" y="64" width="36" height="36" rx="8"/>
  <rect class="accs" x="74" y="74" width="16" height="16" rx="3"/>
  <text class="n acc" x="116" y="80">01</text>
  <text class="h ink" x="64" y="132">Runs on your CPU</text>
  <text class="b muted" x="64" y="160">No GPU and no CUDA anywhere. Both</text>
  <text class="b muted" x="64" y="182">speech models use the processor you</text>
  <text class="b muted" x="64" y="204">already have.</text>

  <!-- 2. No API key -->
  <rect class="card" x="424" y="40" width="352" height="176" rx="8"/>
  <rect class="badge" x="448" y="64" width="36" height="36" rx="8"/>
  <path class="accs" d="M 458 84 a 5 5 0 1 1 10 0 M 456 84 h 16 v 10 h -16 z"/>
  <text class="n acc" x="500" y="80">02</text>
  <text class="h ink" x="448" y="132">Nothing to sign up for</text>
  <text class="b muted" x="448" y="160">No API key. It reaches Claude through</text>
  <text class="b muted" x="448" y="182">the CLI you are already logged into,</text>
  <text class="b muted" x="448" y="204">on the plan you already pay for.</text>

  <!-- 3. Local -->
  <rect class="card" x="808" y="40" width="352" height="176" rx="8"/>
  <rect class="badge" x="832" y="64" width="36" height="36" rx="8"/>
  <path class="accs" d="M 850 74 l 9 5 v 7 c 0 5 -4 8 -9 10 c -5 -2 -9 -5 -9 -10 v -7 z"/>
  <text class="n acc" x="884" y="80">03</text>
  <text class="h ink" x="832" y="132">Your voice stays put</text>
  <text class="b muted" x="832" y="160">Transcription and speech both happen</text>
  <text class="b muted" x="832" y="182">on this machine. No cloud speech</text>
  <text class="b muted" x="832" y="204">service is ever contacted.</text>

  <!-- ROW 2 -->
  <!-- 4. Streaming -->
  <rect class="card" x="40" y="248" width="352" height="176" rx="8"/>
  <rect class="badge" x="64" y="272" width="36" height="36" rx="8"/>
  <path class="accs" d="M 74 290 h 4 M 80 284 v 12 M 86 280 v 20 M 92 286 v 8"/>
  <text class="n acc" x="116" y="288">04</text>
  <text class="h ink" x="64" y="340">Speaks as it thinks</text>
  <text class="b muted" x="64" y="368">The first sentence plays aloud while</text>
  <text class="b muted" x="64" y="390">Claude is still writing the rest of</text>
  <text class="b muted" x="64" y="412">the answer.</text>

  <!-- 5. Toggle -->
  <rect class="card" x="424" y="248" width="352" height="176" rx="8"/>
  <rect class="badge" x="448" y="272" width="36" height="36" rx="8"/>
  <rect class="accs" x="456" y="284" width="20" height="12" rx="6"/>
  <circle class="acc" cx="471" cy="290" r="3.5"/>
  <text class="n acc" x="500" y="288">05</text>
  <text class="h ink" x="448" y="340">One switch, no launcher</text>
  <text class="b muted" x="448" y="368">claudechat on starts the engine and</text>
  <text class="b muted" x="448" y="390">speaks; off stops both. Nothing runs</text>
  <text class="b muted" x="448" y="412">in between unless you ask.</text>

  <!-- 6. Voices -->
  <rect class="card" x="808" y="248" width="352" height="176" rx="8"/>
  <rect class="badge" x="832" y="272" width="36" height="36" rx="8"/>
  <path class="accs" d="M 844 296 v -8 a 6 6 0 0 1 12 0 v 8 M 841 293 v 4 M 859 293 v 4"/>
  <text class="n acc" x="884" y="288">06</text>
  <text class="h ink" x="832" y="340">Fifty-four voices</text>
  <text class="b muted" x="832" y="368">Nine languages, eight of them British.</text>
  <text class="b muted" x="832" y="390">Changing voice is one line in a config</text>
  <text class="b muted" x="832" y="412">file, not a code change.</text>
</svg>
