<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 968 388" width="100%" role="img" aria-labelledby="architecture-dark-title architecture-dark-desc">
  <title id="architecture-dark-title">How claudechat fits together</title>
  <desc id="architecture-dark-desc">Two entry points reach one resident engine over a private Unix socket: a Claude Code hook that hands over finished replies, and a terminal client you talk to. The engine keeps the Whisper and Kokoro models in memory, sends prompts to Claude using your existing login, and plays speech through the speakers.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a9b0b7"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#00d7b6"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#07090b"/>
  <path d="M 232,100 H 296 Q 304,100 304,108 V 148 Q 304,156 312,156 H 368" fill="none" stroke="#a9b0b7" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 232,284 H 296 Q 304,284 304,276 V 220 Q 304,212 312,212 H 368" fill="none" stroke="#a9b0b7" stroke-width="1.2" marker-end="url(#arrow)"/>
  <path d="M 592,156 H 656 Q 664,156 664,148 V 108 Q 664,100 672,100 H 728" fill="none" stroke="#00d7b6" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <path d="M 592,212 H 656 Q 664,212 664,220 V 276 Q 664,284 672,284 H 728" fill="none" stroke="#a9b0b7" stroke-width="1.2" marker-end="url(#arrow)"/>
