  <rect x="244" y="265" width="48" height="12" rx="2" fill="#07090b"/>
  <text x="268" y="274" fill="#c8ccce" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VOICE</text>
  <rect x="636" y="81" width="56" height="12" rx="2" fill="#07090b"/>
  <text x="664" y="90" fill="#c8ccce" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PROMPT</text>
  <rect x="676" y="265" width="48" height="12" rx="2" fill="#07090b"/>
  <text x="700" y="274" fill="#c8ccce" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">AUDIO</text>

  <rect x="40" y="64" width="192" height="72" rx="6" fill="#07090b"/>
  <rect x="40" y="64" width="192" height="72" rx="6" fill="#101419" stroke="#f5f7f8" stroke-width="1"/>
  <rect x="52" y="74" width="44" height="12" rx="2" fill="none" stroke="#f5f7f8" stroke-opacity="0.45" stroke-width="0.8"/>
  <text x="74" y="83" fill="#f5f7f8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOOK</text>
  <text x="136" y="108" fill="#f5f7f8" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Claude Code</text>
  <text x="136" y="126" fill="#a9b0b7" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">speaks its replies</text>
  <rect x="40" y="248" width="192" height="72" rx="6" fill="#07090b"/>
  <rect x="40" y="248" width="192" height="72" rx="6" fill="#101419" stroke="#f5f7f8" stroke-width="1"/>
  <rect x="52" y="258" width="36" height="12" rx="2" fill="none" stroke="#f5f7f8" stroke-opacity="0.45" stroke-width="0.8"/>
  <text x="70" y="267" fill="#f5f7f8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CLI</text>
  <text x="136" y="292" fill="#f5f7f8" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Terminal client</text>
  <text x="136" y="310" fill="#a9b0b7" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">you talk, it answers</text>
  <rect x="376" y="124" width="216" height="112" rx="6" fill="#07090b"/>
  <rect x="376" y="124" width="216" height="112" rx="6" fill="rgba(0,215,182,0.12)" stroke="#00d7b6" stroke-width="1"/>
