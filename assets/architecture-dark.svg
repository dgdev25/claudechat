  <text x="484" y="186" fill="#a9b0b7" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Whisper + Kokoro resident</text>
  <text x="484" y="212" fill="#c8ccce" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">unix socket · 0600</text>
  <rect x="736" y="64" width="192" height="72" rx="6" fill="#07090b"/>
  <rect x="736" y="64" width="192" height="72" rx="6" fill="rgba(245,247,248,0.04)" stroke="rgba(245,247,248,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="748" y="74" width="60" height="12" rx="2" fill="none" stroke="rgba(245,247,248,0.30)" stroke-opacity="0.45" stroke-width="0.8"/>
  <text x="778" y="83" fill="rgba(245,247,248,0.30)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REMOTE</text>
  <text x="832" y="108" fill="#f5f7f8" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Claude</text>
  <text x="832" y="126" fill="#a9b0b7" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">your existing login</text>
  <rect x="736" y="248" width="192" height="72" rx="6" fill="#07090b"/>
  <rect x="736" y="248" width="192" height="72" rx="6" fill="#101419" stroke="#f5f7f8" stroke-width="1"/>
  <rect x="748" y="258" width="52" height="12" rx="2" fill="none" stroke="#f5f7f8" stroke-opacity="0.45" stroke-width="0.8"/>
  <text x="774" y="267" fill="#f5f7f8" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AUDIO</text>
  <text x="832" y="292" fill="#f5f7f8" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Speakers</text>
  <text x="832" y="310" fill="#a9b0b7" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sentence by sentence</text>

  <line x1="24" y1="340" x2="944" y2="340" stroke="rgba(245,247,248,0.14)" stroke-width="0.8"/>
  <text x="24" y="358" fill="#a9b0b7" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="104" y="349" width="12" height="10" rx="2" fill="rgba(0,215,182,0.12)" stroke="#00d7b6" stroke-width="1"/>
  <text x="124" y="358" fill="#a9b0b7" font-size="9" font-family="'Geist', sans-serif">one process, always warm</text>
  <rect x="308" y="349" width="12" height="10" rx="2" fill="rgba(245,247,248,0.04)" stroke="rgba(245,247,248,0.30)" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="328" y="358" fill="#a9b0b7" font-size="9" font-family="'Geist', sans-serif">off your machine</text>
  <text x="500" y="358" fill="#c8ccce" font-size="9" font-family="'Geist', sans-serif" font-style="italic">Either door reaches the same engine.</text>
</svg>